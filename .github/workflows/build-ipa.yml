name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]
      extra_deb_urls:
        description: "Optional: direct links to extra tweak .deb files to inject too (space or comma separated)"
        required: false
        default: ""
        type: string
      build_tweak:
        description: "Build spoti.pw from source (turn off to inject only the .deb links above)"
        required: false
        default: true
        type: boolean

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        run: |
          mkdir -p ipa
          curl -fsSL "${{ inputs.ipa_url }}" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      # Inputs reach the shell through env, never pasted into the script text.
      - name: Download extra .deb tweaks
        if: inputs.extra_deb_urls != ''
        env:
          EXTRA_DEB_URLS: ${{ inputs.extra_deb_urls }}
        run: |
          mkdir -p extra
          n=0
          for url in $(echo "$EXTRA_DEB_URLS" | tr ',' ' '); do
            n=$((n + 1))
            f="extra/extra-$n.deb"
            curl -fsSL "$url" -o "$f" || { echo "::error::Download failed for extra .deb #$n"; exit 1; }
            dpkg-deb --info "$f" >/dev/null 2>&1 || { echo "::error::Extra file #$n is not a .deb"; exit 1; }
            echo "- extra tweak #$n: $(dpkg-deb -f "$f" Package) $(dpkg-deb -f "$f" Version)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Build and inject
        env:
          BUILD_TWEAK: ${{ inputs.build_tweak }}
        run: |
          EXTRA="$(ls extra/*.deb 2>/dev/null | tr '\n' ' ' || true)"
          if [ "$BUILD_TWEAK" = "true" ]; then
            make release EXTRA="$EXTRA"
          else
            make release EXTRA="$EXTRA" NO_BUILD=1
          fi

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
